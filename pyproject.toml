[project]
name = "sysmon-agent"
version = "0.1.0"
description = "Cross-platform Python agent that monitors CPU, RAM, disk, network and processes against configurable thresholds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["psutil>=5.9", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
sysmon = "sysmon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sysmon*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
